limit_req_zone $binary_remote_addr zone=static_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=snapshot_limit:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=register_limit:10m rate=3r/m;
limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name thebazaar-twitch.online;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://thebazaar-twitch.online$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.thebazaar-twitch.online;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://api.thebazaar-twitch.online$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name thebazaar-twitch.online;

    server_tokens off;
    root /opt/thebazaar-twitch-extension/extension;
    index viewer.html;

    ssl_certificate /etc/letsencrypt/live/api.thebazaar-twitch.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.thebazaar-twitch.online/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:thebazaar_ssl:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 32k;
    client_body_timeout 10s;
    keepalive_timeout 20s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn per_ip_conn 30;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    access_log /var/log/nginx/thebazaar_site_access.log;
    error_log /var/log/nginx/thebazaar_site_error.log warn;

    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = / {
        limit_req zone=static_limit burst=80 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/thebazaar_proxy.conf;
    }

    location = /new {
        limit_req zone=static_limit burst=80 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/thebazaar_proxy.conf;
    }

    location = /register {
        limit_req zone=register_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/thebazaar_proxy.conf;
    }

    location ^~ /api/ {
        return 308 https://api.thebazaar-twitch.online$request_uri;
    }

    location ^~ /v1/ {
        return 308 https://api.thebazaar-twitch.online$request_uri;
    }

    location ~* \.(?:js|css|json|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        limit_req zone=static_limit burst=80 nodelay;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        limit_req zone=static_limit burst=80 nodelay;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.thebazaar-twitch.online;

    server_tokens off;
    root /opt/thebazaar-twitch-extension/extension;
    index viewer.html;

    ssl_certificate /etc/letsencrypt/live/api.thebazaar-twitch.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.thebazaar-twitch.online/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:thebazaar_ssl:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 32k;
    client_body_timeout 10s;
    keepalive_timeout 20s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn per_ip_conn 30;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors https://www.twitch.tv https://*.ext-twitch.tv https://*.twitch.tv" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    access_log /var/log/nginx/thebazaar_api_access.log;
    error_log /var/log/nginx/thebazaar_api_error.log warn;

    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) {
        return 405;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = / {
        return 308 https://thebazaar-twitch.online/new$is_args$args;
    }

    location = /new {
        return 308 https://thebazaar-twitch.online/new$is_args$args;
    }

    location = /register {
        return 308 https://thebazaar-twitch.online/register$is_args$args;
    }

    location = /health {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/thebazaar_proxy.conf;
    }

    location = /api/register {
        limit_req zone=register_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/thebazaar_proxy.conf;
    }

    location = /api/companion/verify {
        limit_req zone=register_limit burst=8 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/thebazaar_proxy.conf;
    }

    location ^~ /v1/companion/ {
        limit_req zone=snapshot_limit burst=8 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/thebazaar_proxy.conf;
    }

    location ^~ /v1/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/thebazaar_proxy.conf;
    }

    location ^~ /bazaar-art/s.bazaardb.gg/ {
        limit_req zone=static_limit burst=80 nodelay;
        proxy_ssl_server_name on;
        proxy_set_header Host s.bazaardb.gg;
        proxy_pass https://s.bazaardb.gg/;
    }

    location ^~ /bazaar-art/i.bazaardb.gg/ {
        limit_req zone=static_limit burst=80 nodelay;
        proxy_ssl_server_name on;
        proxy_set_header Host i.bazaardb.gg;
        proxy_pass https://i.bazaardb.gg/;
    }

    location ~* \.(?:js|css|json|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        limit_req zone=static_limit burst=80 nodelay;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        limit_req zone=static_limit burst=80 nodelay;
        try_files $uri $uri/ =404;
    }
}
