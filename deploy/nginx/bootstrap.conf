limit_req_zone $binary_remote_addr zone=bootstrap_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.thebazaar-twitch.online thebazaar-twitch.online;

    server_tokens off;
    root /opt/thebazaar-twitch-extension/extension;
    limit_req_status 429;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        limit_req zone=bootstrap_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
